name: Build Windows

on:
  push:
    branches: [port/windows]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install frontend deps
        working-directory: ui
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Build frontend
        working-directory: ui
        run: pnpm run build

      - name: Build LLM worker sidecar
        run: |
          cargo build --release -p whimpr-llm-worker --target x86_64-pc-windows-msvc
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/whimpr-llm-worker.exe `
            src-tauri/binaries/whimpr-llm-worker-x86_64-pc-windows-msvc.exe

      - name: Check workspace
        run: cargo check --workspace

      - name: Test workspace
        run: cargo test --workspace
